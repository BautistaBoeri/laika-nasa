<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laika · Análogos de Marte</title>
<meta name="description" content="Lugares de la Tierra parecidos a sitios de Marte, encontrados comparando datos orbitales variable por variable.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23E8794A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-row">
    <a class="brand" href="#top">
      <h1 class="brand-name">Laika</h1>
    </a>

    <div class="targets">
      <label class="targets-label" for="target-select" data-t="marsSite"></label>
      <select class="target-select" id="target-select"></select>
    </div>

    <div class="top-tools">
      <button type="button" class="switch" id="layer-toggle" aria-pressed="false" data-t-aria="layer">
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-long" data-t="layer"></span><span class="switch-short" data-t="layerShort"></span>
      </button>
      <button type="button" class="switch" id="sat-toggle" aria-pressed="false" data-t-aria="satellite">
        <span class="switch-track"><span class="switch-knob"></span></span>
        <span class="switch-long" data-t="satellite"></span><span class="switch-short" data-t="satelliteShort"></span>
      </button>
    </div>
  </div>
</header>

<main>
<section id="top" class="screen" data-t-aria="mapLabel">
  <div id="map" class="map"></div>
  <p id="status" class="status" role="status" data-t="loading"></p>

  <div class="hint" id="hint">
    <span class="hint-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8EEF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v2"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4L4.5 15a2 2 0 0 1 3.3-2.2L9 14"/></svg>
    </span>
    <span class="hint-text">
      <span class="hint-main" data-t="hint"></span>
      <span class="hint-sub" id="hint-sub"></span>
    </span>
  </div>

  <div class="dock" id="dock">
    <div class="card target-card">
      <svg class="globe" viewBox="0 0 72 72" role="img" id="globe">
        <circle cx="36" cy="36" r="30" fill="#3A2219" stroke="#E8794A" stroke-width="1.5"/>
        <ellipse cx="36" cy="36" rx="30" ry="9" fill="none" stroke="#5E3727" stroke-width="1"/>
        <ellipse cx="36" cy="36" rx="12" ry="30" fill="none" stroke="#5E3727" stroke-width="1"/>
        <line x1="6" y1="36" x2="66" y2="36" stroke="#6E4130" stroke-width="1"/>
        <circle id="globe-ring" cx="36" cy="36" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <circle id="globe-dot" cx="36" cy="36" r="2.5" fill="#FFFFFF"/>
      </svg>
      <div class="target-info">
        <span class="eyebrow" data-t="marsSite"></span>
        <span class="target-name" id="target-name"></span>
        <span class="mono small dim" id="target-coords"></span>
        <p class="target-blurb" id="target-blurb"></p>
        <span class="target-mission" id="target-mission"></span>
      </div>
    </div>

    <div class="card legend">
      <span class="legend-title" id="legend-title"></span>
      <div class="legend-steps" id="legend-steps"></div>
      <div class="legend-known">
        <span class="diamond" aria-hidden="true"></span>
        <span data-t="legendKnown"></span>
      </div>
    </div>
  </div>

  <aside class="panel" id="panel" aria-hidden="true" inert data-t-aria="panelLabel">
    <div class="panel-grip" aria-hidden="true"><span></span></div>
    <div class="panel-body">
      <div class="panel-head">
        <div class="panel-titles">
          <span class="badge-known" id="p-badge">
            <span class="diamond small" aria-hidden="true"></span><span data-t="knownBadge"></span>
          </span>
          <span class="rank" id="p-rank"></span>
          <h2 class="p-title" id="p-title" tabindex="-1"></h2>
          <span class="p-subtitle" id="p-subtitle"></span>
        </div>
        <button type="button" class="close" id="p-close" data-t-aria="close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8EEF7" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="score-row">
        <div class="score">
          <span class="score-num" id="p-score"></span>
          <span class="score-label"><i class="sw" id="p-score-sw"></i><span id="p-score-label"></span></span>
        </div>
        <div class="figure">
          <img id="p-img" alt="" hidden>
          <div class="locator" id="p-locator"></div>
          <span class="figure-tag" id="p-figure-tag"></span>
        </div>
      </div>

      <div class="vars">
        <div class="vars-head">
          <h3 class="eyebrow" data-t="varsTitle"></h3>
          <span class="small dim" id="p-vars-count"></span>
        </div>
        <div class="var-list" id="p-vars"></div>
      </div>

      <div class="validation" id="p-validation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7CCBFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
        <p id="p-validation-text"></p>
      </div>

      <div class="texts" id="p-texts"></div>

      <div class="numbers-only" id="p-numbers">
        <div class="extremes">
          <div class="extreme"><span class="extreme-title" data-t="bestVar"></span><span id="p-best-label"></span><span class="mono extreme-pct" id="p-best-pct"></span></div>
          <div class="extreme"><span class="extreme-title" data-t="worstVar"></span><span id="p-worst-label"></span><span class="mono extreme-pct" id="p-worst-pct"></span></div>
        </div>
        <p class="small dim" id="p-desc"></p>
      </div>
    </div>
  </aside>
</section>

<nav class="below-nav" data-t-aria="sections">
  <a href="#sitio" class="nav-site" data-t="siteEyebrow" hidden></a>
</nav>

<section id="sitio" class="section" hidden>
  <div class="section-inner">
    <div class="split">
      <div class="section-head">
        <h2 id="site-title"></h2>
        <div class="site-text" id="site-text"></div>
      </div>
      <figure class="photo">
        <img id="site-img" alt="">
        <figcaption id="site-caption"></figcaption>
      </figure>
    </div>
    <div class="grid4" id="site-facts"></div>
    <p class="sources" id="site-sources"></p>
  </div>
</section>

</main>

<footer class="footer">
  <p class="footer-note">Laika · NASA Space Apps Challenge 2026<span id="sample-note" hidden></span></p>
  <p class="footer-team">Bautista Boeri · Nicolas Grüner · Luciana Larrosa · Luciano Serra</p>
</footer>

<script src="vendor/leaflet.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
